[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legal-graphrag"
version = "0.1.0"
description = "Closed-corpus GraphRAG for Maharashtra society self-redevelopment research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chromadb>=1.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "neo4j>=6,<7",
  "pydantic>=2.12,<3",
  "python-dotenv>=1,<2",
  "sentence-transformers>=5,<6",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["domain", "llm", "persistence", "retrieval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
